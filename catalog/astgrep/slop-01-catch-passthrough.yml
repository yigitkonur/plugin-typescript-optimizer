id: slop-01-catch-swallow
language: TypeScript
ignores: ['**/*.d.ts', '**/*.d.mts', '**/*.d.cts', '**/generated/**', '**/node_modules/**']
severity: hint
message: >-
  catch clause logs the bare error and returns null/undefined/false: a blind swallow that destroys the root
  cause and the stack. Keep only as an intentional boundary fallback with a real log message.
note: >-
  Structural twin of tell t2: exactly two statements (comments ignored), console.<m>(e) (or e.message /
  e.stack) followed by return null | undefined | false. A log line that carries a context string, a rethrow,
  or any other work does not match. See catalog/rules/slop-01-useless-try-catch.md.
rule:
  kind: catch_clause
  all:
    - has: {field: parameter, kind: identifier, pattern: $E}
    - has:
        field: body
        kind: statement_block
        all:
          - has:
              nthChild: {position: 1, ofRule: {not: {kind: comment}}}
              kind: expression_statement
              has:
                any:
                  - pattern: console.$M($E)
                  - pattern: console.$M($E.message)
                  - pattern: console.$M($E.stack)
          - has:
              nthChild: {position: 2, ofRule: {not: {kind: comment}}}
              kind: return_statement
              any:
                - has: {kind: "null"}
                - has: {kind: undefined}
                - has: {kind: "false"}
          - not:
              has:
                nthChild: {position: 3, ofRule: {not: {kind: comment}}}
---
