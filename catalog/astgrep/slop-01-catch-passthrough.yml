# slop-01 (useless try/catch): three structural rules (rethrow-only, blind log-and-return swallow, empty catch),
# each in a typescript and a tsx document. Multi-line safe; comments are ignored when counting statements.
id: slop-01-catch-passthrough
language: TypeScript
ignores: ['**/*.d.ts', '**/*.d.mts', '**/*.d.cts', '**/generated/**', '**/node_modules/**']
severity: hint
message: >-
  catch clause only rethrows its own binding (no recovery, no context, no cause): useless try/catch.
note: >-
  Structural, multi-line safe: the catch body contains exactly one statement (comments ignored) and it is
  `throw <the catch parameter>`. Enriching rethrows (new Error(..., {cause})) and catches that do any other
  work do not match. See catalog/rules/slop-01-useless-try-catch.md.
rule:
  kind: catch_clause
  all:
    - has: {field: parameter, kind: identifier, pattern: $E}
    - has:
        field: body
        kind: statement_block
        all:
          - has:
              nthChild: {position: 1, ofRule: {not: {kind: comment}}}
              kind: throw_statement
              has: {kind: identifier, pattern: $E}
          - not:
              has:
                nthChild: {position: 2, ofRule: {not: {kind: comment}}}
---
id: slop-01-catch-passthrough-tsx
language: Tsx
ignores: ['**/*.d.ts', '**/*.d.mts', '**/*.d.cts', '**/generated/**', '**/node_modules/**']
severity: hint
message: >-
  catch clause only rethrows its own binding (no recovery, no context, no cause): useless try/catch.
note: >-
  Structural, multi-line safe: the catch body contains exactly one statement (comments ignored) and it is
  `throw <the catch parameter>`. Enriching rethrows (new Error(..., {cause})) and catches that do any other
  work do not match. See catalog/rules/slop-01-useless-try-catch.md.
rule:
  kind: catch_clause
  all:
    - has: {field: parameter, kind: identifier, pattern: $E}
    - has:
        field: body
        kind: statement_block
        all:
          - has:
              nthChild: {position: 1, ofRule: {not: {kind: comment}}}
