id: slop-01-catch-empty
language: TypeScript
ignores: ['**/*.d.ts', '**/*.d.mts', '**/*.d.cts', '**/generated/**', '**/node_modules/**']
severity: hint
message: >-
  Empty catch block: the error is swallowed silently. Delete the try/catch or handle/log the error with
  context. A catch that contains a comment is treated as a documented intentional swallow and is not reported.
note: >-
  Structural twin of tell t3: the catch body has no named child at all (not even a comment). See
  catalog/rules/slop-01-useless-try-catch.md.
rule:
  kind: catch_clause
  has:
    field: body
    kind: statement_block
    not:
      has:
        pattern: $_X
