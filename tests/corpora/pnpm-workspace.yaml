# Monorepo layout
packages:
  - 'apps/*'
  - "packages/*"
  - tools/**
  - '!packages/legacy'   # being deleted
  - '!**/__fixtures__/**'

catalog:
  typescript: ^5.9.3
  react: 18.3.1
  '@types/node': ^22.10.0
  vitest: "~2.1.0"

catalogs:
  legacy:
    react: ^17.0.2

onlyBuiltDependencies:
  - esbuild
  - sharp
  - '@swc/core'

overrides:
  'lodash@<4.17.21': '>=4.17.21'

shamefullyHoist: false
minimumReleaseAge: 1440
