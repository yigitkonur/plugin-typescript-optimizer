# Worker config
name = "edge-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = [ "nodejs_compat", "nodejs_als" ]
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 0.1

[vars]
API_URL = "https://api.example.com/v1"   # trailing comment
LOG_LEVEL = 'debug'
RETRIES = 3

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_classes = ["Counter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = [
  "Room",   # chat rooms
]

[[kv_namespaces]]
binding = "CACHE"
id = "0123456789abcdef"

[env.production]
name = "edge-api-prod"
routes = [{ pattern = "api.example.com/*", zone_name = "example.com" }]

[env.production.vars]
LOG_LEVEL = "warn"
BANNER = """
Hello,
  production \
  world"""
