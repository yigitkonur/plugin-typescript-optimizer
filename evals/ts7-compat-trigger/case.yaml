schema_version: "1.1"
name: ts7-compat-trigger
description: A TypeScript 7 / typescript-eslint compatibility question brings in the ts7-compat knowledge skill.
tags: [skills, triggers]
runs: 3
execution:
  prompt: "typescript-eslint says it does not support TS 7.0 and my lint step crashes after I upgraded. What are my options?"
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ts7-compat"'
    arm: both
  - name: mentions-the-alias-scheme
    type: regex
    pattern: 'typescript6|tsc6|alias'
    flags: i
