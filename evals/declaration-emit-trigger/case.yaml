schema_version: "1.1"
name: declaration-emit-trigger
description: A TS4060 declaration-emit error brings in the declaration-emit knowledge skill.
tags: [skills, triggers]
runs: 3
execution:
  prompt: "After I stopped exporting an interface that nothing imports, tsc --declaration fails with: error TS4060: Return type of exported function has or is using private name 'Session'. How should I fix it?"
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?declaration-emit"'
    arm: both
  - name: never-recommends-suppression
    type: llm
    focus: last_message
    criteria: |
      PASS if the reply does not recommend silencing the error with @ts-ignore, @ts-expect-error or skipLibCheck (mentioning that they do not work is fine).
      FAIL if it recommends any of them as the fix.
