schema_version: "1.1"
name: declaration-emit-quiet
description: An ordinary type error does not bring in the declaration-emit knowledge skill.
tags: [skills, triggers, negative]
runs: 3
execution:
  prompt: "TypeScript says: error TS2322: Type 'string' is not assignable to type 'number' on a prop of my React component. How do I fix it?"
  max_turns: 6
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-stayed-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?declaration-emit"'
    min: 0
    max: 0
    arm: both
