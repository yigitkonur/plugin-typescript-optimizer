schema_version: "1.1"
name: fix-dirty-tree-refuses
description: /ts-optimize:fix on a repository with uncommitted changes explains the dirty tree and makes no commit.
tags: [fix, preconditions]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/ts-optimize:fix --approve-low"
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: cites-the-dirty-tree
    type: regex
    pattern: 'uncommitted|dirty|clean|stash'
    flags: i
  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: 'git commit|ts-opt(?:\\?")? +commit'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
