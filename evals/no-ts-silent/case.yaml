schema_version: "1.1"
name: no-ts-silent
description: In a repository without TypeScript the plugin says there is nothing to do and creates nothing.
tags: [audit, silence]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/ts-optimize:audit"
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: says-nothing-to-do
    type: regex
    pattern: 'nothing to do|no typescript'
    flags: i
  - name: creates-no-artifacts
    type: file_exists
    path: ".ts-optimize/**"
    exists: false
  - name: no-scan
    type: tool_used
    tool: Bash
    input_match: 'ts-opt(?:\\?")? +scan'
    min: 0
    max: 0
    arm: both
