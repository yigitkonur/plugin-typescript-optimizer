name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests:   # kit:manifests:start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Install Claude Code CLI (for plugin validate)
        run: npm install -g @anthropic-ai/claude-code
      - name: Manifests, versions, install policy, kit copies, rendered blocks
        run: python3 scripts/kit/check-manifests.py --validate
      - name: Secret scan (tree and history)
        run: python3 scripts/kit/secret-scan.py --tree --history
      - name: Local markdown links
        run: python3 scripts/kit/check-links.py
  # kit:manifests:end
  validate:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure
        run: |
          test ! -e package.json && test ! -e CLAUDE.md
          test "$(git ls-files -s bin/ts-opt | cut -c1-6)" = 100755

  core:
    name: core (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18.17.0', '22', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: node tests/harness/ci.mjs prepare
      - run: node tests/harness/ci.mjs core

  full:
    name: full suite (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '26' }
          - { os: macos-latest, node: '26' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: oven-sh/setup-bun@v2
      - name: ripgrep
        run: command -v rg || (sudo apt-get install -y ripgrep || brew install ripgrep)
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: node tests/harness/ci.mjs prepare
      - run: node tests/harness/ci.mjs full
