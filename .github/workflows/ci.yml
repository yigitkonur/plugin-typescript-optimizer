name: ci
on:
  push:
    branches: [main]
    tags: ['ts-optimize--v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Manifest and structure
        run: |
          npm i -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          test ! -e package.json && test ! -e CLAUDE.md
          test "$(git ls-files -s bin/ts-opt | cut -c1-6)" = 100755

  core:
    name: core (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18.17.0', '22', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: node tests/harness/ci.mjs prepare
      - run: node tests/harness/ci.mjs core

  full:
    name: full suite (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '26' }
          - { os: macos-latest, node: '26' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: oven-sh/setup-bun@v2
      - name: ripgrep
        run: command -v rg || (sudo apt-get install -y ripgrep || brew install ripgrep)
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: node tests/harness/ci.mjs prepare
      - run: node tests/harness/ci.mjs full
